name: Release Docker image

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: true

jobs:
  release:
    name: Release linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      IMAGE_TAG: use-python-private-package:${{ github.event.release.tag_name }}
      ASSET_NAME: use-python-private-package-${{ matrix.arch }}.tar.gz

    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.IMAGE_TAG }}
          secrets: |
            github_token=${{ secrets.PYTHON_PACKAGE_TOKEN || github.token }}

      - name: Save image and checksum
        run: |
          docker save "$IMAGE_TAG" | gzip > "$RUNNER_TEMP/$ASSET_NAME"
          cd "$RUNNER_TEMP"
          sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256"

      - name: Upload image to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/$ASSET_NAME" \
            "$RUNNER_TEMP/$ASSET_NAME.sha256" \
            --clobber
